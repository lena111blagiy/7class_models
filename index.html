<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моделювання: інформаційні та матеріальні моделі</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5b6478;--line:#d5dae6;--a:#2f6fed;--abg:#e8f0ff;--b:#d9822b;--bbg:#fff1e0;--ok:#1f9d55;--okbg:#e0f6e9;--bad:#d64545;--badbg:#fde8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141822;--card:#1e2432;--text:#e8ebf3;--muted:#9aa3b8;--line:#333d54;--a:#6b9bff;--abg:#1d2a4a;--b:#f0a45a;--bbg:#3a2b1a;--ok:#4cc982;--okbg:#17352a;--bad:#ff7b7b;--badbg:#3b1f22}}
:root[data-theme="dark"]{--bg:#141822;--card:#1e2432;--text:#e8ebf3;--muted:#9aa3b8;--line:#333d54;--a:#6b9bff;--abg:#1d2a4a;--b:#f0a45a;--bbg:#3a2b1a;--ok:#4cc982;--okbg:#17352a;--bad:#ff7b7b;--badbg:#3b1f22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.45rem;margin:0 0 6px}
p.lead{margin:0 0 14px;color:var(--muted)}
.pool,.zone{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:70px;background:var(--card)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zone h2{margin:0 0 8px;font-size:1.05rem;text-align:center}
.zone.a{border-color:var(--a);background:var(--abg)}.zone.a h2{color:var(--a)}
.zone.b{border-color:var(--b);background:var(--bbg)}.zone.b h2{color:var(--b)}
.zone .items{display:flex;flex-direction:column;gap:8px;min-height:120px}
.zone.over,.pool.over{outline:3px solid var(--a)}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:grab;user-select:none;-webkit-user-select:none;font-size:.97rem;touch-action:manipulation}
.chip:hover{border-color:var(--a)}
.chip.sel{outline:3px solid var(--a);transform:scale(1.03)}
.chip.dragging{opacity:.4}
.chip.ok{background:var(--okbg);border-color:var(--ok)}
.chip.bad{background:var(--badbg);border-color:var(--bad)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
button{font:inherit;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--a);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--text);border:1.5px solid var(--line)}
#res{font-weight:600}
.hint{font-size:.88rem;color:var(--muted);margin-top:10px}
.expl{margin-top:12px;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:none;font-size:.93rem}
.expl b{display:block;margin-bottom:4px}
@media (max-width:520px){.cols{gap:8px}.zone{padding:8px}.chip{padding:8px 9px;font-size:.9rem}}
</style>
</head>
<body>
<div class="wrap">
<h1>Моделювання: розсортуй моделі</h1>
<p class="lead">Перетягни кожну картку в потрібний стовпець: <b>інформаційні</b> чи <b>матеріальні</b> моделі. На телефоні — торкнись картки, потім торкнись стовпця.</p>

<div class="pool" id="pool" data-zone="pool"></div>

<div class="cols">
  <div class="zone a" data-zone="info"><h2>📊 Інформаційні моделі</h2><div class="items" id="info"></div></div>
  <div class="zone b" data-zone="mat"><h2>🧱 Матеріальні моделі</h2><div class="items" id="mat"></div></div>
</div>

<div class="bar">
  <button id="check">Перевірити</button>
  <button class="sec" id="reset">Спочатку</button>
  <span id="res"></span>
</div>
<div class="hint">Картку можна повернути назад, перетягнувши її в верхню область.</div>
<div class="expl" id="expl"></div>
</div>

<script>
const ITEMS=[
["Глобус","mat","Глобус — матеріальна (предметна) модель Землі."],
["Макет будинку з картону","mat","Макет — це фізичний предмет."],
["Модель літака для збирання","mat","Зменшена фізична копія літака."],
["Манекен","mat","Фізична модель людської фігури."],
["Модель молекули з кульок і стрижнів","mat","Об’ємна предметна модель."],
["Скелет у кабінеті біології","mat","Навчальний муляж — матеріальна модель."],
["Планетарій (модель Сонячної системи)","mat","Предметна модель із рухомими частинами."],
["Іграшкова машинка","mat","Зменшена матеріальна копія автомобіля."],
["Креслення деталі","info","Креслення описує об’єкт графічно — це інформаційна модель."],
["Формула S = a · b","info","Математична формула — знакова інформаційна модель."],
["Таблиця розкладу уроків","info","Табличний опис — інформаційна модель."],
["Блок-схема алгоритму","info","Графічна інформаційна модель процесу."],
["Графік зміни температури","info","Діаграми й графіки — інформаційні моделі."],
["План евакуації кабінету","info","Схема на папері чи екрані — інформаційна модель."],
["Схема метро","info","Схематичне зображення — інформаційна модель."],
["Опис героя твору","info","Словесний опис — інформаційна модель."]
];
const pool=document.getElementById('pool');
let sel=null,checked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  document.getElementById('info').innerHTML='';document.getElementById('mat').innerHTML='';pool.innerHTML='';
  document.getElementById('res').textContent='';document.getElementById('expl').style.display='none';
  checked=false;sel=null;
  shuffle(ITEMS.map((x,i)=>i)).forEach(i=>{
    const c=document.createElement('div');c.className='chip';c.draggable=true;c.textContent=ITEMS[i][0];c.dataset.i=i;
    c.addEventListener('dragstart',e=>{c.classList.add('dragging');e.dataTransfer.setData('text/plain',i);e.dataTransfer.effectAllowed='move'});
    c.addEventListener('dragend',()=>c.classList.remove('dragging'));
    c.addEventListener('click',e=>{e.stopPropagation();if(sel&&sel!==c)sel.classList.remove('sel');sel=(sel===c)?null:c;c.classList.toggle('sel',sel===c)});
    pool.appendChild(c);
  });
}
function target(zoneEl){
  if(zoneEl.dataset.zone==='pool')return pool;
  return zoneEl.querySelector('.items');
}
function place(chip,zoneEl){
  chip.classList.remove('ok','bad','sel');
  target(zoneEl).appendChild(chip);
  if(sel===chip)sel=null;
  document.getElementById('res').textContent='';
}
document.querySelectorAll('[data-zone]').forEach(z=>{
  z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
  z.addEventListener('dragleave',()=>z.classList.remove('over'));
  z.addEventListener('drop',e=>{
    e.preventDefault();z.classList.remove('over');
    const i=e.dataTransfer.getData('text/plain');
    const chip=document.querySelector('.chip[data-i="'+i+'"]');
    if(chip)place(chip,z);
  });
  z.addEventListener('click',()=>{if(sel)place(sel,z)});
});
document.getElementById('check').onclick=()=>{
  const left=pool.children.length;
  if(left){document.getElementById('res').textContent='Спочатку розсортуй усі картки (залишилось: '+left+')';return}
  let ok=0,wrong=[];
  ['info','mat'].forEach(z=>{
    document.getElementById(z).querySelectorAll('.chip').forEach(c=>{
      const it=ITEMS[c.dataset.i];
      if(it[1]===z){c.classList.add('ok');c.classList.remove('bad');ok++}
      else{c.classList.add('bad');c.classList.remove('ok');wrong.push(it)}
    });
  });
  const total=ITEMS.length,res=document.getElementById('res');
  res.textContent='Результат: '+ok+' з '+total+(ok===total?' 🎉 Чудово!':'');
  const ex=document.getElementById('expl');
  if(wrong.length){
    ex.style.display='block';
    ex.innerHTML='<b>Розбір помилок:</b>'+wrong.map(w=>'• '+w[0]+' — '+w[2]).join('<br>');
  }else ex.style.display='none';
};
document.getElementById('reset').onclick=build;
build();
</script>
</body>
</html>
